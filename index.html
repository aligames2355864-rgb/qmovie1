  background-color: #222;

}

/* ستايل الفوتر (التذييل) الجديد */
footer {
  position: fixed; /* نثبته جوه الشاشة */
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: #111; /* لون أغمق شوية */
  padding: 15px 0;
  font-size: 14px;
  color: #888; /* لون رمادي فاتح */
}

footer a {
  color: #fff; /* لون الحساب أبيض */
  text-decoration: none;
  font-weight: bold;
}

footer a:hover {
  color: #E50914; /* يتغير أحمر من الماوس يجي عليه */
